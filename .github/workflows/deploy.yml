name: Deploy

# Deploys the single Worker (web app + /api/*) to Cloudflare on every push to main.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the
# job is skipped with a notice instead of failing. Optional secrets LLM_API_KEY and
# ELEVENLABS_API_KEY are pushed to the Worker as Worker secrets when present.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm typecheck && pnpm test

      - name: Build and deploy
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm run deploy

      - name: Sync optional Worker secrets
        if: steps.secrets.outputs.ready == 'true'
        working-directory: workers/api
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          for name in LLM_API_KEY ELEVENLABS_API_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | pnpm exec wrangler secret put "$name"
            else
              echo "$name not set; that feature stays in fallback mode."
            fi
          done

      - name: Smoke test
        if: steps.secrets.outputs.ready == 'true' && vars.TOPIAPAUSE_URL != ''
        run: |
          curl -fsS "${{ vars.TOPIAPAUSE_URL }}/api/health"
          ./scripts/demo-curl.sh "${{ vars.TOPIAPAUSE_URL }}"
